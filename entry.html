<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunter</title>

<!--
  ============================================================================
  ENTRY PAGE — one template, two kinds of page
  ============================================================================

  Every gallery collection and every blog post is rendered by this single file.
  Which one you get depends on the id in the address:

      entry.html?id=gal-1     a photo/video collection
      entry.html?id=note-1    a blog post

  The content itself lives in data/entries.json. That means adding a new
  collection or post never creates a new HTML file — it adds a record to the
  JSON — so a design change here updates every entry page at once.

  With vercel.json in place these also answer to tidy addresses:
      /work/gal-1   and   /notes/note-1
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/avatar.png">

<style>
/* ---------------------------------------------------------------------------
   Same tokens as index.html so the two pages stay visually identical.
   --------------------------------------------------------------------------- */
:root{
  --pine-deep:#152019;
  --pine:#1E2E23;
  --ink:#071E0C;
  --cream:#E7E2D0;
  --sand:#D9D2BB;
  --display:'Libre Franklin','Helvetica Neue',Arial,sans-serif;
  --body:'Montserrat','Segoe UI',Helvetica,Arial,sans-serif;
  --page:1180px;
  --radius:12px;
}
*{box-sizing:border-box;}
html{background:var(--pine-deep);}
body{margin:0; background:var(--cream); color:var(--pine-deep);
     font-family:var(--body); -webkit-font-smoothing:antialiased;}
img,video{display:block; max-width:100%;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
:focus-visible{outline:2px solid var(--sand); outline-offset:3px; border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important;}}
.wrap{max-width:var(--page); margin:0 auto; padding:0 28px;}

/* ---------- Nav ---------- */
header{position:sticky; top:0; z-index:50; background:var(--pine-deep);}
.nav-wrap{max-width:var(--page); margin:0 auto; display:flex; align-items:center;
          justify-content:space-between; gap:24px; padding:14px 28px;}
.nav-wrap .mark{height:26px; width:auto;}
nav.links{display:flex; gap:26px; flex-wrap:wrap;}
nav.links a{font-size:.92rem; color:var(--sand); opacity:.72; transition:opacity .2s ease;}
nav.links a:hover{opacity:1;}

/* ---------- Header block ---------- */
.entry-head{background:var(--pine); padding:52px 0 60px;}
.back{font-size:.82rem; color:var(--sand); opacity:.8; display:inline-block; margin-bottom:26px;}
.back:hover{opacity:1;}
.entry-head .meta{font-size:.95rem; color:var(--cream); opacity:.85;}
.entry-head h1{
  font-family:var(--display); font-weight:900; letter-spacing:-.02em;
  font-size:clamp(2.1rem,5.5vw,3.8rem); line-height:1.04;
  color:var(--sand); margin:.12em 0 0; max-width:20ch;
}
.entry-head .lede{font-size:1rem; line-height:1.6; color:var(--cream);
                  max-width:60ch; margin:20px 0 0; opacity:.92;}
.entry-head .subtitle{font-size:1.05rem; color:var(--sand); opacity:.85; margin:8px 0 0;}
.lang-btn{font-size:.76rem; color:var(--sand); opacity:.75; border:1px solid rgba(231,226,208,.35);
  border-radius:6px; padding:4px 10px; flex:none; background:none;}
.lang-btn:hover{opacity:1; background:rgba(231,226,208,.08);}
.banner{width:100%; aspect-ratio:21/9; object-fit:cover; border-radius:6px; margin:26px 0 0;}

/* ---------- Collection grid ---------- */
.collection{background:var(--pine); padding:0 0 90px;}
/* Masonry. Columns are a grid; each item is given a row span matching its own
   height by the script below, so tall and wide media pack with no gaps. */
.media-grid{display:grid; grid-template-columns:repeat(3,1fr);
            grid-auto-rows:8px; column-gap:18px; align-items:start;}
.m-item{margin:0; grid-row-end:span 30;}
.m-item.full{grid-column:1 / -1;}
.m-item.half{grid-column:span 2;}
.m-item img,
.m-item video{width:100%; border-radius:6px; object-fit:cover; background:rgba(231,226,208,.07);}
.m-item figcaption{font-size:.78rem; color:var(--cream); opacity:.75; margin-top:8px;}
.embed-wrap{position:relative; width:100%; aspect-ratio:16/9; border-radius:6px; overflow:hidden;
  background:rgba(231,226,208,.07); display:flex; align-items:center; justify-content:center;}
.embed-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
.embed-wrap.instagram{aspect-ratio:auto; background:none;}
.embed-wrap a{color:var(--sand); text-decoration:underline; font-size:.85rem;}

/* ---------- Blog post body ---------- */
.post{background:var(--cream); padding:56px 0 100px;}
.post-body{max-width:68ch; margin:0 auto;}
.post-body h2{font-family:var(--display); font-weight:800; font-size:1.6rem;
              margin:38px 0 12px; color:var(--pine);}
.post-body h3{font-family:var(--display); font-weight:700; font-size:1.2rem;
              margin:30px 0 10px; color:var(--pine);}
.post-body p{font-size:1rem; line-height:1.75; margin:0 0 18px;}
.post-body blockquote{
  margin:26px 0; padding:4px 0 4px 22px;
  border-left:3px solid var(--pine); font-size:1.05rem; line-height:1.6;
}
.post-body ul,.post-body ol{line-height:1.75; padding-left:22px; margin:0 0 18px;}
.post-body a{text-decoration:underline;}
.post-body figure{margin:30px 0;}
.post-body figure img,
.post-body figure video{width:100%; border-radius:8px;}
.post-body figure figcaption{font-size:.78rem; opacity:.7; margin-top:8px; text-align:center;}
/* Attachment width, set per figure in the editor */
.post-body figure.w-narrow{max-width:62%; margin-left:auto; margin-right:auto;}
.post-body figure.w-wide{
  width:min(var(--page), 100vw - 56px);
  margin-left:50%; transform:translateX(-50%);
}

/* ---------- Empty state ---------- */
.empty{
  text-align:center; padding:70px 20px; border-radius:10px;
  border:1px dashed rgba(231,226,208,.35); color:var(--cream); opacity:.7;
  font-size:.9rem;
}
.post .empty{border-color:rgba(21,32,25,.3); color:var(--pine-deep);}

/* ---------- Footer ---------- */
footer{background:var(--pine-deep); padding:18px 0;}
.footer-inner{max-width:var(--page); margin:0 auto; padding:0 28px;
              display:flex; align-items:center; justify-content:space-between; gap:20px;}
.footer-inner .mark{height:24px; width:auto;}
.footer-links{display:flex; gap:30px;}
.footer-links a{color:var(--sand); font-size:.88rem; text-decoration:underline;}

/* ---------- Animations ---------- */
@media (prefers-reduced-motion:no-preference){
  [data-anim]{opacity:0; transition:opacity .7s ease, transform .7s ease;}
  [data-anim="up"]   {transform:translateY(26px);}
  [data-anim="left"] {transform:translateX(-26px);}
  [data-anim="right"]{transform:translateX(26px);}
  [data-anim="zoom"] {transform:scale(.94);}
  [data-anim].shown  {opacity:1; transform:none;}
}

@media (max-width:900px){
  .media-grid{grid-template-columns:repeat(2,1fr);}
  .m-item.half{grid-column:span 1;}
  .post-body figure.w-wide{width:auto; margin-left:0; transform:none;}
}
@media (max-width:640px){
  .wrap,.nav-wrap,.footer-inner{padding-left:18px; padding-right:18px;}
  .nav-wrap{flex-direction:column; align-items:flex-start; gap:10px;}
  .media-grid{grid-template-columns:1fr;}
  .post-body figure.w-narrow{max-width:none;}
  .footer-inner{flex-direction:column; align-items:flex-start; gap:14px;}
}
</style>
</head>

<body>

<header>
  <div class="nav-wrap">
    <a href="index.html"><img class="mark" src="assets/hunter-wordmark.png" alt="Hunter"></a>
    <nav class="links">
      <a href="index.html#home">home</a>
      <a href="index.html#gallery">gallery</a>
      <a href="index.html#about">about</a>
      <a href="index.html#notes">field notes</a>
      <a href="index.html#contact">contact</a>
    </nav>
    <button id="langBtn" class="lang-btn" type="button" aria-label="Switch language">ES</button>
  </div>
</header>

<main id="main"></main>

<footer>
  <div class="footer-inner">
    <a href="index.html"><img class="mark" src="assets/hunter-wordmark.png" alt="Hunter"></a>
    <div class="footer-links">
      <a href="index.html#contact">Contact</a>
      <a id="ig" href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</footer>

<script>
/* ===========================================================================
   RENDER
   Read the id from the address, pull that record out of data/entries.json,
   and build either a collection grid or a blog post from it. Re-runs
   whenever the language toggle is used.
   =========================================================================== */
const params = new URLSearchParams(location.search);
const id = params.get('id');
const main = document.getElementById('main');
const langBtn = document.getElementById('langBtn');

const esc = str => String(str ?? '').replace(/[&<>"]/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]
));

/* A media file is shown as a <video> when its extension says so. */
const isVideo = src => /\.(mp4|webm|mov|m4v)$/i.test(src || '');

function ytId(url){
  const m = String(url || '').match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : '';
}

function embedTag(m){
  const url = m.url || m.src || '';
  if (m.provider === 'youtube'){
    const vid = ytId(url);
    return vid
      ? `<div class="embed-wrap"><iframe src="https://www.youtube.com/embed/${vid}" title="YouTube video"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen loading="lazy"></iframe></div>`
      : `<div class="embed-wrap"><a href="${esc(url)}" target="_blank" rel="noopener">Watch on YouTube</a></div>`;
  }
  if (m.provider === 'instagram'){
    return `<div class="embed-wrap instagram"><blockquote class="instagram-media"
      data-instgrm-permalink="${esc(url)}" data-instgrm-version="14" style="width:100%; margin:0;">
      <a href="${esc(url)}" target="_blank" rel="noopener">View this post on Instagram</a>
    </blockquote></div>`;
  }
  return `<div class="embed-wrap"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>`;
}

function loadInstagramEmbed(){
  if (window.instgrm){ window.instgrm.Embeds.process(); return; }
  if (document.getElementById('ig-embed-script')) return;
  const s = document.createElement('script');
  s.id = 'ig-embed-script'; s.async = true; s.src = 'https://www.instagram.com/embed.js';
  document.body.appendChild(s);
}

function mediaTag(m){
  if (m.kind === 'embed') return embedTag(m);
  const style = m.ar ? ` style="aspect-ratio:${esc(m.ar)};object-position:${esc(m.pos || '50% 50%')}"` : '';
  return isVideo(m.src)
    ? `<video src="${esc(m.src)}" controls playsinline preload="metadata"${style}></video>`
    : `<img src="${esc(m.src)}" alt="${esc(m.alt || '')}" loading="lazy"${style}>`;
}

function orientClass(o){
  return o === 'v' ? 'v' : (o === 'full' ? 'full' : (o === 'half' ? 'half' : ''));
}

function renderCollection(e, lang){
  const title    = (lang === 'en' && e.title_en)    ? e.title_en    : e.title;
  const subtitle = (lang === 'en' && e.subtitle_en) ? e.subtitle_en : e.subtitle;
  const desc     = (lang === 'en' && e.desc_en)     ? e.desc_en     : e.desc;

  const items = (e.media || []).map(m => `
    <figure class="m-item ${orientClass(m.orient)}" data-anim="up">
      ${mediaTag(m)}
      ${m.caption ? `<figcaption>${esc(m.caption)}</figcaption>` : ''}
    </figure>`).join('');

  main.innerHTML = `
    <div class="entry-head">
      <div class="wrap">
        <a class="back" href="index.html#gallery" data-en="">← back to gallery</a>
        ${e.year ? `<div class="meta">${esc(e.year)}</div>` : ''}
        <h1>${esc(title || 'Untitled')}</h1>
        ${subtitle ? `<p class="subtitle">${esc(subtitle)}</p>` : ''}
        ${desc ? `<p class="lede">${esc(desc)}</p>` : ''}
      </div>
    </div>
    ${e.banner ? `<div class="wrap"><img class="banner" src="${esc(e.banner)}" alt=""></div>` : ''}
    <div class="collection">
      <div class="wrap">
        ${items
          ? `<div class="media-grid">${items}</div>`
          : `<div class="empty">No photos in this collection yet — add some in the editor.</div>`}
      </div>
    </div>`;

  if ((e.media || []).some(m => m.kind === 'embed' && m.provider === 'instagram')) loadInstagramEmbed();
}

function renderPost(e, lang){
  const useEn    = lang === 'en' && Array.isArray(e.blocks_en) && e.blocks_en.length;
  const blocks   = useEn ? e.blocks_en : e.blocks;
  const title    = (lang === 'en' && e.title_en)    ? e.title_en    : e.title;
  const desc     = (lang === 'en' && e.desc_en)     ? e.desc_en     : e.desc;
  const category = (lang === 'en' && e.category_en) ? e.category_en : e.category;

  const body = (blocks || []).map(b => {
    if (b.t === 'figure'){
      return `<figure class="${esc(b.w || '')}" data-anim="up">
        ${mediaTag(b)}
        ${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}
      </figure>`;
    }
    if (b.t === 'embed'){
      return `<figure data-anim="up">${embedTag(b)}</figure>`;
    }
    // Rich-text blocks are stored as sanitised HTML produced by the editor.
    return b.html || '';
  }).join('');

  const date = e.date
    ? new Date(e.date + 'T00:00:00').toLocaleDateString(lang === 'en' ? 'en-US' : 'es-HN',
        {year:'numeric', month:'long', day:'numeric'})
    : '';

  main.innerHTML = `
    <div class="entry-head">
      <div class="wrap">
        <a class="back" href="index.html#notes" data-en="">← back to field notes</a>
        <div class="meta">${[esc(category), esc(date)].filter(Boolean).join(' · ')}</div>
        <h1>${esc(title || 'Untitled')}</h1>
        ${desc ? `<p class="lede">${esc(desc)}</p>` : ''}
      </div>
    </div>
    <div class="post">
      <div class="wrap">
        <div class="post-body">
          ${body || `<div class="empty">This post is empty — write it in the editor.</div>`}
        </div>
      </div>
    </div>`;

  if ((blocks || []).some(b => b.t === 'embed' && b.provider === 'instagram')) loadInstagramEmbed();
}

function notFound(msg){
  main.innerHTML = `<div class="entry-head"><div class="wrap">
      <a class="back" href="index.html">← back to the site</a>
      <h1>Nothing here</h1>
      <p class="lede">${esc(msg)}</p>
    </div></div>`;
}

/* ----- Masonry + scroll-reveal, re-run after every (re)render ----- */
function layoutAndReveal(){
  const grid = main.querySelector('.media-grid');
  if (grid){
    const ROW = 8, GAP = 18;
    const layout = () => {
      grid.querySelectorAll('.m-item').forEach(it => {
        it.style.gridRowEnd = 'span ' + Math.ceil((it.getBoundingClientRect().height + GAP) / ROW);
      });
    };
    layout();
    grid.querySelectorAll('img, video').forEach(m => {
      m.addEventListener('load', layout);
      m.addEventListener('loadedmetadata', layout);
    });
    window.addEventListener('resize', layout);
    if (document.fonts) document.fonts.ready.then(layout);
  }
  const els = main.querySelectorAll('[data-anim]');
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(ents => ents.forEach(en => {
      if (en.isIntersecting){ en.target.classList.add('shown'); io.unobserve(en.target); }
    }), {threshold:.12});
    els.forEach(el => io.observe(el));
  } else {
    els.forEach(el => el.classList.add('shown'));
  }
}

/* ----- Static chrome translated by hand (data-en attributes) ----- */
function applyStaticTranslations(lang){
  document.querySelectorAll('[data-en]').forEach(el => {
    if (el.dataset.esOrig === undefined) el.dataset.esOrig = el.innerHTML;
    el.innerHTML = (lang === 'en' && el.dataset.en) ? el.dataset.en : el.dataset.esOrig;
  });
}

/* ===========================================================================
   LANGUAGE + BOOT
   =========================================================================== */
let db = null;
function currentLang(){
  try {
    const stored = localStorage.getItem('siteLang');
    if (stored) return stored;
  } catch(e) {}
  return (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'es';
}
let lang = currentLang();

function renderAll(){
  const e = db.entries && db.entries[id];
  if (!e) return notFound('That entry does not exist yet.');

  document.title = (e.title || 'Hunter') + ' — Hunter';
  if (db.site && db.site.instagram) document.getElementById('ig').href = db.site.instagram;

  (e.type === 'note' ? renderPost : renderCollection)(e, lang);
  applyStaticTranslations(lang);
  if (langBtn) langBtn.textContent = lang.toUpperCase();
  layoutAndReveal();
}

langBtn?.addEventListener('click', () => {
  lang = lang === 'en' ? 'es' : 'en';
  try { localStorage.setItem('siteLang', lang); } catch(e) {}
  renderAll();
});

fetch('data/entries.json', {cache:'no-store'})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => { db = d; renderAll(); })
  .catch(() => notFound('Could not load data/entries.json.'));
</script>
</body>
</html>
